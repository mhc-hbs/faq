<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Beheer | Vragen MHC HBS</title>
    <link rel="icon" href="/favicon.png" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script>
      // Same rules as Decap's own slug cleaning: lower case, no accents, words joined by dashes.
      function maakSlug(tekst) {
        return String(tekst || '')
          .normalize('NFD')
          .replace(/[̀-ͯ]/g, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '')
          .slice(0, 80)
          .replace(/-+$/, '');
      }

      // Decap calls saving "publiceren", but whether a question is on the site depends on the
      // Status field. Rename the save button and its messages to "opslaan" to avoid two meanings.
      (function () {
        var nl = CMS.getLocale('nl');
        if (!nl) return;
        var knoppen = {
          publish: 'Opslaan',
          publishing: 'Opslaan...',
          published: 'Opgeslagen',
          publishNow: 'Opslaan',
          publishAndCreateNew: 'Opslaan en nieuwe vraag maken',
          publishAndDuplicate: 'Opslaan en kopie maken',
        };
        var meldingen = {
          entryPublished: 'Opgeslagen. De site is over een minuut bijgewerkt.',
          entrySaved: 'Opgeslagen. De site is over een minuut bijgewerkt.',
        };
        Object.assign(nl.editor.editorToolbar, knoppen);
        Object.assign(nl.ui.toast, meldingen);
        CMS.registerLocale('nl', nl);
      })();

      // Fill the slug from the question when it is left empty. Decap uses this field
      // as the file name of a new entry; for existing entries the file name never changes.
      CMS.registerEventListener({
        name: 'preSave',
        handler: function ({ entry }) {
          var data = entry.get('data');
          var slug = maakSlug(data.get('slug')) || maakSlug(data.get('vraag'));
          return data.set('slug', slug);
        },
      });

      // Preview pane: show a question roughly as it appears on the site, without the raw field values.
      CMS.registerPreviewStyle('/admin/voorbeeld.css');

      var MAANDEN = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];

      function datumNL(waarde) {
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(waarde || ''));
        return m ? Number(m[3]) + ' ' + MAANDEN[Number(m[2]) - 1] + ' ' + m[1] : '';
      }

      // Label of a select option, so the preview shows "Materiaal en kleding" instead of the slug.
      function labelVan(collection, veld, waarde) {
        var field = collection.get('fields').find(function (f) { return f.get('name') === veld; });
        var optie = field && field.get('options').find(function (o) { return o.get('value') === waarde; });
        return optie ? optie.get('label') : waarde || '';
      }

      CMS.registerPreviewTemplate('faq', function (props) {
        var data = props.entry.get('data');
        var datum = datumNL(data.get('laatst_gecheckt'));
        return h('div', {},
          h('p', { className: 'kruimel' }, labelVan(props.collection, 'categorie', data.get('categorie'))),
          data.get('status') !== 'gepubliceerd'
            ? h('p', { className: 'banner' }, 'Concept: deze vraag staat nog niet op de site.')
            : null,
          h('h1', {}, data.get('vraag') || 'Nog geen vraag'),
          props.widgetFor('body'),
          h('div', { className: 'meta' },
            h('p', {}, 'Antwoord van: ' + labelVan(props.collection, 'eigenaar', data.get('eigenaar'))),
            datum ? h('p', {}, 'Laatst gecheckt op ' + datum) : null
          )
        );
      });

      // Log in through api/auth on whichever domain this page is served from.
      CMS.init({ config: { backend: { base_url: window.location.origin } } });
    </script>
  </body>
</html>
